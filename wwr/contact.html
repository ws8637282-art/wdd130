<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description" content="Contact White Water Rafting for reservations, questions, and information about our rafting adventures.">

    <meta name="author" content="Whitney Carleen Snyder">

    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>

<header>

    <img src="images/logo.png" alt="White Water Rafting Logo">

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
    </nav>

</header>


<main>


    <section class="contact-intro">

        <h1>White Water Rafting Company</h1>

        <p>
            123 Main River Street<br>
            Kolob, California<br>
            +1 999 999 9999<br>
            info@whitewater.com
        </p>

    </section>



    <section class="contact-area">


        <div class="map">

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7747.923475807196!2d-171.7915285139148!3d-13.841335296239421!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x71a51473cf1c3023%3A0x720858e24b2d181!2sLotopa%2C%20Apia!5e0!3m2!1sen!2sws!4v1785195245338!5m2!1sen!2sws"
                width="400"
                height="300"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

        </div>



        <div class="contact-form">

            <form>


                <label for="name">Name:</label>

                <input 
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    required>



                <label for="email">Email:</label>

                <input 
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Your email"
                    required>



                <p>Message Purpose:</p>


                <label>

                    <input
                        type="radio"
                        id="general"
                        name="purpose"
                        value="general"
                        required>

                    General Inquiry

                </label>



                <label>

                    <input
                        type="radio"
                        id="reservation"
                        name="purpose"
                        value="reservation">

                    Reservation Question

                </label>



                <label>

                    <input
                        type="radio"
                        id="suggestion"
                        name="purpose"
                        value="suggestion">

                    Website Suggestion

                </label>



                <label for="message">
                    Message:
                </label>


                <textarea
                    id="message"
                    name="message"
                    placeholder="Type your message here"
                    required></textarea>



                <label>

                    <input
                        type="checkbox"
                        id="newsletter"
                        name="newsletter">

                    Please subscribe me to the monthly newsletter

                </label>



                <button type="submit">
                    Get in Touch!
                </button>


            </form>


        </div>


    </section>





    <section class="employees">


        <h2>We Are Here to Serve You</h2>



        <figure>

            <img
                src="images/happy-client.jpg"
                alt="Sarah Johnson employee profile">

            <figcaption>
                Sarah Johnson<br>
                General Manager
            </figcaption>

        </figure>



        <figure>

            <img
                src="images/rafting1.jpg"
                alt="David Lee employee profile">

            <figcaption>
                David Lee<br>
                Lead River Guide
            </figcaption>

        </figure>



        <figure>

            <img
                src="images/hero.jpg"
                alt="Emily Brown employee profile">

            <figcaption>
                Emily Brown<br>
                Reservations Manager
            </figcaption>

        </figure>


    </section>


</main>





<footer>


    <p>
        © 2026 White Water Rafting | Whitney Carleen Snyder
    </p>



    <nav class="socialmedia">


        <a href="#">
            <img src="images/facebook.png" alt="Visit our Facebook page">
        </a>


        <a href="#">
            <img src="images/instagram.png" alt="Visit our Instagram page">
        </a>


        <a href="#">
            <img src="images/linkedin.png" alt="Visit our LinkedIn page">
        </a>


    </nav>


</footer>


</body>

</html>
