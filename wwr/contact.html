<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description" content="Contact White Water Rafting for reservations, questions, and information about our rafting adventures.">

    <meta name="author" content="Whitney Carleen Snyder">

    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>

<header>

    <img src="images/logo.png" alt="White Water Rafting Logo">

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
    </nav>

</header>



<main>


    <section class="contact-intro">

        <h1>White Water Rafting Company</h1>

        <p>
            123 Main River Street<br>
            Kolob, California<br>
            +1 999 999 9999<br>
            info@whitewater.com
        </p>

    </section>



    <section class="contact-area">


        <div class="map">

            <iframe
                src="YOUR_GOOGLE_MAP_EMBED_LINK_HERE"
                width="400"
                height="300"
                loading="lazy">
            </iframe>

        </div>



        <div class="contact-form">

            <form>


                <label for="name">Name:</label>

                <input 
                    type="text" 
                    id="name" 
                    name="name"
                    placeholder="Placeholder"
                    required>



                <label for="email">Email:</label>

                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="Placeholder"
                    required>



                <p>Message Purpose:</p>


                <label>
                    <input 
                    type="radio" 
                    name="purpose" 
                    value="general"
                    required>
                    General Inquiry
                </label>



                <label>
                    <input 
                    type="radio" 
                    name="purpose" 
                    value="reservation">
                    Reservation Question
                </label>



                <label>
                    <input 
                    type="radio" 
                    name="purpose" 
                    value="suggestion">
                    Website Suggestion
                </label>



                <label for="message">
                    Message:
                </label>


                <textarea 
                    id="message" 
                    name="message"
                    placeholder="Type here"
                    required>
                </textarea>



                <label>

                    <input 
                    type="checkbox" 
                    name="newsletter">

                    Please subscribe me to the monthly newsletter

                </label>



                <button type="submit">
                    Get in Touch!
                </button>


            </form>


        </div>


    </section>





    <section class="employees">


        <h2>We Are Here to Serve You</h2>



        <figure>

            <img 
            src="images/happy-client.jpg" 
            alt="Sarah Johnson employee profile">

            <figcaption>
                Sarah Johnson<br>
                General Manager
            </figcaption>

        </figure>



        <figure>

            <img 
            src="images/rafting1.jpg" 
            alt="David Lee employee profile">

            <figcaption>
                David Lee<br>
                Lead River Guide
            </figcaption>

        </figure>



        <figure>

            <img 
            src="images/hero.jpg" 
            alt="Emily Brown employee profile">

            <figcaption>
                Emily Brown<br>
                Reservations Manager
            </figcaption>

        </figure>


    </section>


</main>





<footer>


    <p>
        © 2026 White Water Rafting | Whitney Carleen Snyder
    </p>



    <nav class="socialmedia">


        <a href="#">
            <img src="images/facebook.png" alt="Facebook">
        </a>


        <a href="#">
            <img src="images/instagram.png" alt="Instagram">
        </a>


        <a href="#">
            <img src="images/linkedin.png" alt="LinkedIn">
        </a>


    </nav>


</footer>


</body>

</html>
