<section class="contact-intro">

    <h1>Contact White Water Rafting</h1>

    <address>
        Lotopa, Apia, Samoa<br>
        Phone: +685 123 4567<br>
        Email: info@whitewaterrafting.ws
    </address>

</section>

<section class="contact-area">

    <div class="map">

        <iframe
            title="White Water Rafting Location Map"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7747.923475807196!2d-171.7915285139148!3d-13.841335296239421!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x71a51473cf1c3023%3A0x720858e24b2d181!2sLotopa%2C%20Apia!5e0!3m2!1sen!2sws!4v1785268321035!5m2!1sen!2sws"
            width="600"
            height="450"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </div>

    <div class="contact-form">

        <h2>Send Us a Message</h2>

        <form>

            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required>

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Your email"
                required>

            <p>Message Purpose:</p>

            <label>
                <input
                    type="radio"
                    name="purpose"
                    value="general"
                    required>
                General Inquiry
            </label>

            <label>
                <input
                    type="radio"
                    name="purpose"
                    value="reservation">
                Reservation Question
            </label>

            <label>
                <input
                    type="radio"
                    name="purpose"
                    value="suggestion">
                Website Suggestion
            </label>

            <label for="message">Message:</label>

            <textarea
                id="message"
                name="message"
                placeholder="Type your message here"
                required></textarea>

            <label>
                <input
                    type="checkbox"
                    id="newsletter"
                    name="newsletter">
                Please subscribe me to the monthly newsletter
            </label>

            <button type="submit">Get in Touch!</button>

        </form>

    </div>

</section>
